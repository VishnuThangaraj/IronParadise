services:
  # Backend FastAPI Server
  server:
    build:
      context: ./server
      dockerfile: dockerFile
    container_name: ironparadise_server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/
      - DB_NAME=ironparadise
    depends_on:
      - mongodb

  # Frontend React Admin (Vite)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: ironparadise_admin
    ports:
      - "5151:5151"
    volumes:
      - ./admin:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - server

  # Database
  mongodb:
    image: mongo:latest
    container_name: ironparadise_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
